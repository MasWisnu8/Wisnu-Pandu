<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Wisnu Pandu</title>
<meta name="description" content="Dashboard admin Wisnu Pandu — edit profil, keterampilan, proyek, pengalaman, kontak.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Brush+Script+Std&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f3;
  --bg-panel: #ffffff;
  --bg-soft: #f5f1e8;
  --primary: #0a1f3a;
  --primary-2: #1e3a5f;
  --primary-soft: #eaf0f7;
  --text: #1a1a1a;
  --text-mid: #5a5a5a;
  --text-light: #8a8a8a;
  --text-faint: #a8a8a8;
  --border: #e3ddd3;
  --accent: #b89b6a;
  --shadow: 0 2px 8px rgba(10,31,58,.06);
  --shadow-lg: 0 12px 40px rgba(10,31,58,.10);
  --radius: 20px;
  --radius-lg: 32px;
  --radius-full: 9999px;
  --radius-sm: 14px;
  --font-sans: 'Inter','Segoe UI','Roboto','Helvetica Neue',sans-serif;
  --font-display: 'Playfair Display','Georgia','Times New Roman',serif;
  --font-hand: 'Brush Script Std','Segoe Script','Lucida Handwriting',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.hidden{display:none !important}

/* ================= LOGIN OVERLAY ================= */
.login-overlay{
  position:fixed;inset:0;z-index:100;
  background:url('images/dashboard.jpg') center/cover no-repeat,rgba(10,31,58,.65);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;
}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:16px}
.login-logo .logo-icon{width:84px;height:84px;border-radius:50%;background:linear-gradient(145deg,#0a1f3a,#1e3a5f);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;box-shadow:0 8px 24px rgba(10,31,58,.25)}
.login-logo .logo-text{font-family:var(--font-display);font-size:1.6rem;font-weight:900;letter-spacing:2px;color:var(--primary)}
.login-logo .sub{font-size:.9rem;color:var(--text-mid);font-family:var(--font-hand);font-style:italic;letter-spacing:1px}
.login-form{max-width:420px;width:100%}
.login-form .field{margin-bottom:18px}
.login-form label{display:block;font-size:.88rem;font-weight:600;color:var(--text-mid);margin-bottom:10px;letter-spacing:.5px}
.login-form input{width:100%;padding:16px 18px;border-radius:var(--radius-sm);border:2px solid rgba(10,31,58,.15);background:#fff;color:var(--text);font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s}
.login-form input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(10,31,58,.12)}
.login-form .hint{font-size:.78rem;color:var(--text-light);margin-top:8px;line-height:1.5}
.login-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font-family:var(--font-sans);font-weight:700;border:none;cursor:pointer;border-radius:999px;padding:14px 26px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:filter .2s,transform .15s,box-shadow .2s}
.btn:focus{outline:none;box-shadow:0 0 0 4px rgba(10,31,58,.25)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2);filter:brightness(1.06)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid rgba(10,31,58,.35)}
.btn-outline:hover{background:rgba(10,31,58,.06)}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn-small{padding:10px 18px;font-size:.85rem}

/* ================= DASHBOARD ================= */
.admin{display:none}
.admin.open{display:block}
.admin-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 24px;background:var(--bg-panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50
}
.admin-header .brand{display:flex;align-items:center;gap:12px}
.admin-header .brand .logo-icon{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#0a1f3a,#1e3a5f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
.admin-header .page-title{font-family:var(--font-display);font-size:1.3rem;font-weight:900;color:var(--primary);letter-spacing:1px}
.admin-header .actions{display:flex;gap:10px}
.admin-header .top-right{display:flex;align-items:center;gap:14px}

/* LAYOUT */
.layout{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 12px}
.sidebar .brand-box{display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:var(--radius-sm);background:var(--bg-soft);border:1px solid var(--border);margin-bottom:14px}
.sidebar .brand-box .logo-icon{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#0a1f3a,#1e3a5f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem}
.sidebar .brand-box .logo-text{font-weight:800;color:var(--primary);font-size:1rem;font-family:var(--font-display)}
.sidebar .nav{display:flex;flex-direction:column;gap:4px}
.sidebar .nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--radius-sm);background:var(--bg-panel);color:var(--text);border:1px solid transparent;font-family:var(--font-sans);font-size:.92rem;font-weight:600;text-align:left;cursor:pointer;transition:all .15s}
.sidebar .nav-btn:hover{background:var(--bg-soft);color:var(--primary)}
.sidebar .nav-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sidebar .nav-btn .ico{width:20px;font-size:.95rem;text-align:center}

.main{flex:1;overflow-y:auto;padding:24px 28px}

/* ================= GARY AUDIE STYLE HERO ================= */
.hero{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px;display:flex;align-items:center;gap:48px;max-width:1100px;margin:0 auto 32px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.welcome-hero::before{
  content:'';position:absolute;inset:0;
  background:url('images/dashboard.jpg') center/cover no-repeat,radial-gradient(circle,rgba(10,31,58,.35),transparent 70%);
  opacity:.6;
}
.welcome-hero::before,.welcome-hero .text-col{flex:1;min-width:300px}
.welcome-hero .text-col{flex:1;min-width:300px}
.welcome-hero .greeting{font-family:var(--font-hand);font-size:1.5rem;color:var(--primary);line-height:1.4;letter-spacing:1px;margin-bottom:8px}
.welcome-hero .greeting span{font-size:2rem}
.welcome-hero .name{font-family:var(--font-display);font-size:2.4rem;font-weight:900;color:var(--text);line-height:1.15;margin-bottom:6px}
.welcome-hero .name .accent{color:var(--accent);text-shadow:0 1px 2px rgba(184,155,106,.3)}
.welcome-hero .subtitle{font-size:1rem;color:var(--text-mid);font-weight:500;margin-bottom:20px}
.welcome-hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.welcome-hero .avatar-wrap{flex:0 0 200px;position:relative}
.welcome-hero .avatar-wrap .avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px rgba(10,31,58,.18)}

/* ================= FORM PANE ================= */
.form-pane{display:flex;flex-direction:column;gap:20px;max-width:1200px;margin:0 auto}
.form-grid{display:grid;gap:16px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.88rem;font-weight:600;color:var(--text-mid);margin-bottom:8px;letter-spacing:.3px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-family:var(--font-sans);font-size:.95rem;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(10,31,58,.12)}
.form-group textarea{resize:vertical;min-height:84px}
.form-hint{font-size:.78rem;color:var(--text-light);margin-top:6px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-row .form-group{margin-bottom:8px}
.focus-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.focus-row input{flex:1;min-width:160px}
.photo-pick{position:relative;border:2px dashed var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;cursor:pointer;transition:border-color .15s}
.photo-pick:hover{border-color:var(--primary)}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick .pp-text{font-size:.82rem;color:var(--text-mid);padding:8px 0}
.photo-pick .pp-text b{color:var(--text-mid)}
.skill-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.skill-row input{flex:1;min-width:160px}
.skill-pct{display:flex;align-items:center;gap:8px;flex:0 0 70px}
.skill-pct label{font-size:.78rem;color:var(--text-light)}
.skill-pct input{width:56px;text-align:right}
.list-editor{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.item .full{flex:1 1 200px;min-width:200px}
.item .pct{flex:0 0 70px;text-align:right}
.item input,.item textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:var(--font-sans);font-size:.9rem;color:var(--text);background:#fff}
.item input:focus,.item textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(10,31,58,.12)}
.item .del{margin-left:8px;background:none;border:none;color:#b02a2a;cursor:pointer;font-size:1.1rem;padding:6px 8px;line-height:1}
.item .del:hover{color:#8a1f1f}
.add-btn{margin-top:16px;display:inline-flex;width:100%;justify-content:center}

/* ================= PREVIEW PANE ================= */
.preview-pane{width:100%;min-height:480px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.preview-pane .bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);font-size:.86rem;color:var(--text-mid)}
.preview-pane .bar span{color:var(--text);font-weight:600}
.preview-pane .preview-wrap{flex:1;padding:24px;overflow-y:auto;background:var(--bg)}
.preview-pane .hero{background:linear-gradient(160deg,#0a1f3a 0%,#1e3a5f 55%,#243028);color:#fff;padding:56px 24px;border-radius:var(--radius-lg)}
.preview-pane .hero .badge{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:6px 16px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;margin-bottom:20px}
.preview-pane .hero .avatar-wrap .avatar-img{width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.28)}
.preview-pane .hero h1{color:#fff;font-size:2.2rem;font-weight:800;letter-spacing:-1px}
.preview-pane .hero .sig{font-size:1.05rem;opacity:.9;margin-bottom:8px}
.preview-pane .hero .tagline{font-size:.95rem;opacity:.8;max-width:620px;margin:0 auto 24px}
.preview-pane .hero .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.preview-pane .hero .btn{background:#fff;color:var(--primary);font-weight:700}
.preview-pane .hero .btn-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}
.preview-pane .section{padding:40px 24px}
.preview-pane .section-head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.preview-pane .badge{background:#0a1f3a;color:#fff;padding:5px 14px;border-radius:999px;font-size:.75rem;font-weight:700}
.preview-pane .grid{display:grid;gap:20px}
.preview-pane .two-col{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
.preview-pane .card{background:#fff;border:1px solid var(--border);border-left:4px solid #0089BA;border-radius:var(--radius-sm);padding:20px;box-shadow:0 1px 3px rgba(10,31,58,.06)}
.preview-pane .card h3{font-size:1.1rem;font-weight:800;color:var(--primary);margin-bottom:8px}
.preview-pane .card p{color:var(--text-mid);font-size:.9rem;line-height:1.6}
.preview-pane .skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.preview-pane .skill{background:#fff;border:1px solid var(--border);border-left:4px solid #0089BA;border-radius:var(--radius-sm);padding:14px;box-shadow:0 1px 3px rgba(10,31,58,.06)}
.preview-pane .project-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;box-shadow:0 1px 3px rgba(10,31,58,.06);display:flex;gap:18px;align-items:flex-start}
.preview-pane .project-card .title{font-size:1.08rem;font-weight:800;color:var(--primary)}
.preview-pane .project-card .tech{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.preview-pane .project-card .tech span{background:#eaf0f7;color:var(--text-mid);padding:3px 10px;border-radius:999px;font-size:.72rem}
.preview-pane .project-card p{color:var(--text-mid);font-size:.93rem}
.preview-pane .exp-card{background:#fff;border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:var(--radius-sm);padding:18px;box-shadow:0 1px 3px rgba(10,31,58,.06)}
.preview-pane .exp-card .role{font-size:1.1rem;font-weight:800;color:var(--primary)}
.preview-pane .exp-card .company{font-size:.92rem;color:var(--primary-2);font-weight:700}
.preview-pane .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.preview-pane .contact-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;text-align:center;box-shadow:0 1px 3px rgba(10,31,58,.06)}
.preview-pane .contact-item .ic{font-size:1.4rem}
.preview-pane .contact-item .val{font-size:.92rem;font-weight:700;color:var(--text)}
.preview-pane .footer{background:var(--primary);color:#fff;padding:32px 24px;border-top:4px solid var(--primary);border-radius:var(--radius-sm)}
.preview-pane .footer .copyright{font-size:.82rem;opacity:.75}

/* ================= TOAST ================= */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 22px;border-radius:999px;font-size:.85rem;z-index:300;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#b02a2a}
.toast.success{background:#008F7A}
.toast.info{background:var(--primary)}

/* ================= RESPONSIVE ================= */
@media (max-width:960px){
  .welcome-hero{flex-direction:column;text-align:center;padding:28px 20px}
  .welcome-hero .text-col{min-width:0}
  .welcome-hero .avatar-wrap{flex:0 0 140px;margin:0 auto}
  .welcome-hero .greeting{font-size:1.2rem}
  .welcome-hero .name{font-size:1.9rem}
  .form-grid-2{grid-template-columns:1fr}
  .preview-pane .contact-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .sidebar{width:0 !important;overflow:hidden;position:absolute;left:-9999px}
  .main{padding:16px}
  .admin-header{padding:12px 16px}
  .preview-pane{min-height:360px}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-overlay" id="loginScreen">
  <div class="login-logo">
    <div class="logo-icon">WP</div>
    <div>
      <div class="logo-text">Admin — Wisnu Pandu</div>
      <div class="sub">hi, i'm <span style="color:#0089BA;">Wisnu</span></div>
    </div>
  </div>
  <div class="login-form">

<!-- ================= DASHBOARD ================= -->
<div class="admin" id="admin">
  <header class="admin-header">
    <div class="brand">

      <span style="font-family:var(--font-display);font-weight:900;color:var(--primary);letter-spacing:1px;font-size:1.1rem;">Wisnu Pandu</span>

      <button class="btn btn-outline btn-small" id="saveDraftBtn">💾 Simpan draft</button>

  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="logo-icon">WP</div>
        <span class="logo-text">Wisnu Pandu</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-section="profile"><span class="ico">👤</span><span class="txt">Profil &amp; Umum</span></button>
        <button class="nav-btn" data-section="about"><span class="ico">📝</span><span class="txt">Tentang</span></button>
        <button class="nav-btn" data-section="skills"><span class="ico">🛠</span><span class="txt">Keterampilan</span></button>

          <div class="actions">

</div>

<div class="toast" id="toast"></div>

<script>
var SITE = (typeof window.SITE !== 'undefined') ? window.SITE : {};
var DRAFT_KEY='wisnu_admin_draft', GH_TOKEN_KEY='wisnu_gh_token';
var ADMIN_PASSWORD='admin123';
var $ = function(id){ if(!id)return null; return document.getElementById((id||'').replace(/^#/,'')); };
var $$ = function(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); };
var STATE = { section:'profile' };
var SECTIONS = {
  profile:{ title:'Profil & Umum', icon:'👤' },
  about:{ title:'Tentang', icon:'📝' },
  skills:{ title:'Keterampilan', icon:'🛠' },
  projects:{ title:'Proyek', icon:'📦' },
  experience:{ title:'Pengalaman', icon:'🕰' },
  contact:{ title:'Kontak', icon:'✉' },
  settings:{ title:'Pengaturan & Simpan', icon:'⚙' }
};

function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\//g,'&#47;'); }
function setValue(path, val){
  var node=SITE, keys=path.split('.');
  for(var i=0;i<keys.length-1;i++){
    var k=keys[i];
    if(node[k]===undefined||node[k]===null)node[k]={};
    if(typeof node[k]!=='object')node[k]={};
    node=node[k];
  }
  var last=keys[keys.length-1];
  if(val===null||val===undefined){ delete node[last]; return; }
  node[last]=val;
}
function getVal(path){
  var node=SITE, keys=path.split('.');
  for(var i=0;i<keys.length;i++){
    if(node===undefined||node===null)return undefined;
    node=node[keys[i]];
  }
  return node;
}
function persist(){
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify(SITE));}catch(e){}
  try{localStorage.setItem('admin_logged_in','true');}catch(e){}
}
function loadDraft(){
  try{ var d=localStorage.getItem(DRAFT_KEY); if(d)SITE=JSON.parse(d); }catch(e){ SITE={}; }
}

function showSection(key){

function bindInputs(){
  var pane=$('formPane');
  var inputs=pane.querySelectorAll('input, textarea, select');
  var pathMap={
    'f-site-title':'site.title','f-site-subtitle':'site.subtitle','f-site-tagline':'site.tagline',
    'f-site-description':'site.description','f-site-avatar':'site.avatar','f-site-photo':'site.photo',
    'f-site-isDark':'site.isDark','f-about-name':'about.name','f-about-title':'about.title',
    'f-about-bio':'about.bio','f-contact-email':'contact.email','f-contact-phone':'contact.phone',
    'f-contact-github':'contact.github','f-contact-linkedin':'contact.linkedin'
  };
  inputs.forEach(function(el){
    var path=el.dataset&&el.dataset.path;
    if(!path)path=pathMap[el.id];
    if(!path)return;
    if(el.type==='file')return;
    el.addEventListener('input',function(){ setValue(path,el.value); refreshPreview(); });
  });
  var darkCheck=$('f-site-isDark');
  if(darkCheck){ darkCheck.addEventListener('change',function(){ setValue(darkCheck.dataset.path,darkCheck.checked); refreshPreview(); }); }
  pane.querySelectorAll('input[type=file]').forEach(function(fi){
    fi.addEventListener('change',function(){
      var file=fi.files&&fi.files[0];
      if(!file)return;
      if(file.size>1024*1024){ toast('Gambar terlalu besar (maks 1MB).'); return; }
      var reader=new FileReader();
      reader.onload=function(e){
        var path=fi.dataset.path;
        if(path)setValue(path,e.target.result);
        refreshPreview();
        toast('Foto dipilih.');
      };
      reader.readAsDataURL(file);
    });
  });
  pane.querySelectorAll('.del').forEach(function(btn){
    btn.addEventListener('click',function(){
      var type=btn.dataset.del, idx=parseInt(btn.dataset.idx,10);
      if(type==='skill')getVal(['skills']).splice(idx,1);
      else if(type==='project')getVal(['projects']).splice(idx,1);
      else if(type==='experience')getVal(['experience']).splice(idx,1);
      persist(); renderForm(); refreshPreview();
    });
  });
  $('#addSkillBtn')&&$('#addSkillBtn').addEventListener('click',function(){
    getVal(['skills']).push({name:'',level:60}); persist(); renderForm(); refreshPreview();
  });
  $('#addProjectBtn')&&$('#addProjectBtn').addEventListener('click',function(){
    getVal(['projects']).push({title:'',tech:[],link:'',date:''}); persist(); renderForm(); refreshPreview();
  });
  $('#addExpBtn')&&$('#addExpBtn').addEventListener('click',function(){
    getVal(['experience']).push({role:'',company:'',period:''}); persist(); renderForm(); refreshPreview();
  });
  $('#saveGHToken')&&$('#saveGHToken').addEventListener('click',function(){
    var t=$('#ghToken').value.trim();
    if(!t){ toast('Token kosong. Isi token GitHub.'); return; }
    localStorage.setItem(GH_TOKEN_KEY,t); toast('Token disimpan.');
  });
  $('#clearGHToken')&&$('#clearGHToken').addEventListener('click',function(){
    localStorage.removeItem(GH_TOKEN_KEY); $('#ghToken').value=''; toast('Token dihapus.');
  });
  $$('.nav-btn').forEach(function(b){ b.addEventListener('click',function(){ showSection(b.dataset.section); }); });
  $('#guestBtn')&&$('#guestBtn').addEventListener('click',function(){ window.open(location.origin+(location.pathname.split('/').pop()==='index.html'?'':'/'),'_blank'); });
  $('#pushDataBtn')&&$('#pushDataBtn').addEventListener('click',function(){ var t=$('#ghToken').value.trim(); if(!t){ toast('Token belum diisi.'); return; } pushToGitHub(t); });
  $('#darkToggle')&&$('#darkToggle').addEventListener('change',function(){ document.body.classList.toggle('dark'); document.documentElement.classList.toggle('dark'); });
}

function toast(msg, type){
  var t=$('toast');
  t.textContent=msg;
  t.className='toast '+(type||'info')+' show';
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){ t.className='toast'; }, 3200);
}

function pushToGitHub(token){
  var owner=$('ghOwner').value.trim()||'MasWisnu8';
  var repo=$('ghRepo').value.trim()||'Wisnu-Pandu';
  var branch=$('ghBranch').value.trim()||'main';
  var url='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/data.js?ref='+encodeURIComponent(branch);
  var data={message:'Update data dari admin panel',content:btoa(unescape(encodeURIComponent(JSON.stringify(SITE,null,2)))),branch:branch};
  fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'User-Agent':'wisnu-admin-panel','Accept':'application/vnd.github+json'},body:JSON.stringify(data)})
  .then(function(r){ if(r.ok) return r.json().then(function(j){return {ok:true,msg:'Commit: '+j.commit.url};}); if(r.status===404) return Promise.reject('Repo tidak ditemukan.'); if(r.status===401||r.status===403) return Promise.reject('Token tidak sah.'); return Promise.reject('GitHub menolak (HTTP '+r.status+').'); })
  .then(function(res){ toast(res.msg,'success'); })
  .catch(function(err){ toast('Gagal: '+err,'error'); });
}

function doLogin(){
  var pw=$('loginPassword').value;
  if(pw===ADMIN_PASSWORD){
    try{localStorage.setItem('admin_logged_in','true');}catch(e){}
    $('loginScreen').style.display='none';
    $('admin').className='admin open';
    showSection('profile');
  } else { toast('Password salah. Coba lagi.','error'); $('loginPassword').focus(); }
}

$('loginBtn').addEventListener('click',doLogin);
$('cancelLoginBtn').addEventListener('click',function(){ $('loginScreen').style.display='none'; $('admin').className='admin open'; showSection('profile'); });
$('loginPassword').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });
loadDraft();
if(localStorage.getItem('admin_logged_in')==='true'){ $('loginScreen').style.display='none'; $('admin').className='admin open'; showSection('profile'); }
else { showSection('profile'); }
</script>
